<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablo</title>
</head>
<body>
    <table border="1" cellpadding="5">
        <tr>
           <th rowspan="3"> .. </th>
           <th colspan="2"> .. </th>
        </tr>
        <tr>
            <td> .. </td>
            <td> .. </td>
        </tr>
        <tr>
            <td> .. </td>
            <td> .. </td>
        </tr>
    </table>
    <br>
    <table border="1" cellpadding="5">
        <tr>
            <th>Hücre 1</th>
            <th rowspan="2">Hücre 2</th>
            <th>Hücre 3</th>
        </tr>
        <tr>
            <td>Hücre 4</td>
            <td>Hücre 5</td>
        </tr>
    </table>
    <br>
    <table border="1" cellpadding="5">
        <tr>
            <th>Hücre 1</th>
            <th colspan="2">Hücre 2</th>
        </tr>
        <tr>
            <td>Hücre 4</td>
            <td>Hücre 5</td>
            <td>Hücre 6</td>
        </tr>
    </table>
    <br>
    <table border="1" cellpadding="10">
        <caption>Yazılı notları</caption>
        <thead>
            <tr>
                <th>İsim</th>
                <th>Not</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Halide Edip Adıvar</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Sabiha</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Gökçen</td>
                <td>100</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
